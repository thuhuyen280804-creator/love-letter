<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gửi anh ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #fff0f5, #ffffff, #ffe4ec);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 30px;
        }

        .heart {
            font-size: 70px;
            animation: heartbeat 1.3s infinite;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            color: #e75480;
            font-size: clamp(42px, 10vw, 90px);
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 4px 15px rgba(231, 84, 128, 0.2);
        }

        .message {
            margin-top: 20px;
            color: #777;
            font-size: 20px;
        }

        .heart-small {
            color: #ff6b9a;
            font-size: 28px;
        }

        .flower {
            position: absolute;
            font-size: 25px;
            animation: fall linear infinite;
            top: -50px;
        }

        .f1 { left: 10%; animation-duration: 7s; }
        .f2 { left: 25%; animation-duration: 9s; animation-delay: 2s; }
        .f3 { left: 45%; animation-duration: 8s; animation-delay: 1s; }
        .f4 { left: 65%; animation-duration: 10s; animation-delay: 3s; }
        .f5 { left: 85%; animation-duration: 7s; animation-delay: 1.5s; }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="flower f1">🌸</div>
    <div class="flower f2">🌷</div>
    <div class="flower f3">🌸</div>
    <div class="flower f4">🌺</div>
    <div class="flower f5">🌸</div>

    <div class="container">

        <div class="heart">❤️</div>

        <h1>HÍ LÔ ANH &lt;3</h1>

        <div class="message">
            Gửi anh một chút đáng yêu từ em 💕
        </div>

        <div class="heart-small">
            ♡
        </div>

    </div>

</body>
</html>
